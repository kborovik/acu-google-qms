[project]
name = "gcp-acu-coa"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "google-adk>=2.8.0",
    "reportlab>=5.0.1",
]

[dependency-groups]
dev = [
    "basedpyright",
    "ruff",
]

[project.scripts]
docgen = "docgen.cli:cli"

# Required for uv to install this project (editable) and wire [project.scripts].
# Without a build system, `uv run docgen` cannot resolve the console entry point.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "docgen*"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["agent", "docgen"]
extend-exclude = ["domain", "acumatica"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["agent", "docgen"]
exclude = ["domain", "acumatica", "**/.venv"]
